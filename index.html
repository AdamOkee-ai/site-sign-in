<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Site Sign-In">
<title>Site Sign-In</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: OKEE Electrics house style (white top bar with logo, Barlow, brand red accents, dark buttons); one column on phones, tab bar at the bottom. */
:root{
  --ink:#14171B; --bg:#ECEEF1; --card:#FFFFFF; --sunk:#F5F6F8; --line:#D3D8DE; --text:#14171B; --muted:#5A626C;
  --brand:#E1100A; --btn:#14171B; --btn-ink:#FFFFFF; --info:#1F7FBE; --info-bg:#E4F1FA;
  --good:#157A3A; --good-bg:#E2F3E8; --warn:#7A5300; --warn-bg:#FFF4D6; --bad:#C0281B; --bad-bg:#FBE4E1;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1113; --card:#191C20; --sunk:#14171A; --line:#2E343B; --text:#EEF1F4; --muted:#A0A8B2;
  --brand:#FF4136; --btn:#EEF1F4; --btn-ink:#14171B; --info:#5DB3EA; --info-bg:#132634;
  --good:#43C374; --good-bg:#12301F; --warn:#F2C766; --warn-bg:#33280E; --bad:#FF6A5C; --bad-bg:#3A1612; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1113; --card:#191C20; --sunk:#14171A; --line:#2E343B; --text:#EEF1F4; --muted:#A0A8B2;
  --brand:#FF4136; --btn:#EEF1F4; --btn-ink:#14171B; --info:#5DB3EA; --info-bg:#132634;
  --good:#43C374; --good-bg:#12301F; --warn:#F2C766; --warn-bg:#33280E; --bad:#FF6A5C; --bad-bg:#3A1612; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%;padding-bottom:84px}
body.solo{padding-bottom:24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
[hidden]{display:none!important}

header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto;padding:8px 16px;min-height:56px}
.top-row img{height:40px;width:auto;background:#fff;border-radius:6px;padding:2px;flex:none}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:700 21px/1.05 var(--display);letter-spacing:.01em}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{text-align:right;font:600 12px/1.25 var(--body);color:var(--muted);white-space:nowrap}
.stamp b{display:block;font:700 20px/1 var(--display);color:var(--text);letter-spacing:.01em}
.rolechip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--info-bg);color:var(--info);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}

main{max-width:760px;margin:0 auto;padding:16px}
section.pane{display:flex;flex-direction:column;gap:14px}
h2{margin:0;font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
h3{margin:0;font:700 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted)}
.small{font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px}
.banner{border-radius:10px;padding:12px 14px;font-weight:500}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=time],input[type=date],input[type=search],select{
  width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-weight:400}
input:focus,select:focus{border-color:var(--info)}

.btn{min-height:48px;padding:10px 18px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:700;letter-spacing:.02em}
.btn.dark{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}

/* people list */
.list{display:flex;flex-direction:column}
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;border-radius:0;min-height:62px}
.list>.person:first-child{border-top:0}
button.person:hover{background:color-mix(in srgb,var(--brand) 8%,transparent)}
.person .who{flex:1;min-width:0}
.person .nm{font-weight:600;overflow-wrap:anywhere}
.person .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.in{background:var(--good-bg);color:var(--good)}
.pill.out{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.open{background:var(--warn-bg);color:var(--warn)}
.sigthumb{width:84px;height:30px;flex:none;color:var(--text);opacity:.85}
.times{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;text-align:right;white-space:nowrap}

.grouphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px;background:var(--ink);color:#fff;border-radius:10px 10px 0 0;border-bottom:3px solid var(--brand)}
.grouphead h3{color:#fff}
.grouphead span{font-size:13px;color:#C9D0D6;font-variant-numeric:tabular-nums}
.group{overflow:hidden}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{padding:12px 14px;border-left:6px solid var(--line)}
.tile b{display:block;font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile.t-in{border-left-color:var(--good)} .tile.t-total{border-left-color:var(--brand)} .tile.t-open{border-left-color:var(--warn)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .nm{font-weight:600;overflow-wrap:anywhere}
.bar .track{height:16px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.bar .seg-in{background:var(--good)} .bar .seg-out{background:var(--muted);opacity:.55}
.bar .n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;min-height:64px;background:none;border:0;border-top:4px solid transparent;color:var(--muted);font:700 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:8px 4px}
nav.tabs button[aria-selected=true]{color:var(--text);border-top-color:var(--brand)}
nav.tabs button small{display:block;font:600 12px/1 var(--body);letter-spacing:0;text-transform:none;margin-top:5px;opacity:.85}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-top:4px solid var(--brand);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h2 small{display:block;font:500 14px/1.3 var(--body);text-transform:none;letter-spacing:0;color:var(--muted);margin-top:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:var(--card);min-height:46px;font-weight:700;padding:0 10px}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--btn-ink)}
.projbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;min-height:72px;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);border-left:6px solid var(--brand)}
.projbtn b{font:700 28px/1 var(--display);letter-spacing:.02em}
.projbtn span{font-size:24px;color:var(--muted)}
.roll{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.roll .rbar{position:sticky;top:0;z-index:2;background:var(--brand);color:#fff;padding:12px 16px}
.roll .rbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.roll .rbar h2{color:#fff;font-size:24px}
.roll .rbar .big{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.roll .rbar .btn{background:#fff;color:#14171B;border-color:#fff}
.roll .rbody{max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.tick{width:48px;height:48px;flex:none;border-radius:10px;border:2.5px solid var(--muted);background:var(--card);font:700 28px/1 var(--body);color:transparent}
.tick[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}
.sigwrap{position:relative;border:1.5px dashed var(--muted);border-radius:8px;background:var(--sunk);height:150px}
.sigwrap canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:8px}
.sigwrap .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none;font-size:15px}
.sigwrap .baseline{position:absolute;left:14px;right:14px;bottom:34px;border-bottom:1px solid var(--line);pointer-events:none}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:1em}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;border-left:4px solid var(--brand);padding:12px 18px;border-radius:99px;font-weight:600;z-index:80;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
details.co{border-top:1px solid var(--line)}
details.co:first-child{border-top:0}
details.co>summary{padding:14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;min-height:52px;align-items:center}
details.co .inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.rrow:first-child{border-top:0}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}

/* sign-in gate and footer */
#gate{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 16px 40px}
#gate .gbox{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:14px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;position:relative}
#gate h2{margin:0}
#gate p{margin:0}
#gate .gbtn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;min-height:50px;font-weight:700;font-size:16px}
#gate .gbtn.alt{background:transparent;color:var(--text);border:1.5px solid var(--text)}
#gate .gl{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
#gate .gl input{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;min-height:46px;font-size:16px;color:var(--text)}
#gate .gerr{color:var(--bad);font-weight:600}
#gate .glinks{display:flex;justify-content:space-between}
#gate .glink{background:none;border:0;color:var(--text);text-decoration:underline;padding:6px 0}
#gate .gx{position:absolute;top:12px;right:14px}
#foot{max-width:760px;margin:0 auto;padding:4px 16px 28px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <img src="icons/logo.png" alt="Okee Electrics">
    <div class="brand"><h1 id="siteTitle">Site Sign-In</h1><div class="sub"><span id="subTxt">Okee Electrics</span><span class="rolechip" id="roleChip" hidden></span></div></div>
    <div class="stamp"><b id="dayName">Today</b><span id="dateLong"></span></div>
  </div>
</header>

<main id="main">
  <div id="status" class="banner warn" hidden></div>
  <section class="pane" id="pane-sign" role="tabpanel"></section>
  <section class="pane" id="pane-list" role="tabpanel" hidden></section>
  <section class="pane" id="pane-summary" role="tabpanel" hidden></section>
  <section class="pane" id="pane-setup" role="tabpanel" hidden></section>
</main>
<div id="foot"></div>

<nav class="tabs" aria-label="Sections"><div class="in" id="tabs" role="tablist"></div></nav>

<script src="config.js"></script>
<script>window.__siBackend = new Promise(function (res, rej) { window.__siResolve = res; window.__siReject = rej; });</script>
<script src="db-adapter.js"></script>
<script type="module" src="firebase-shim.js"></script>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
